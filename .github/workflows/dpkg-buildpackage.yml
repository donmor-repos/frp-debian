name: Debian Build Bot
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        required: true

jobs:
  version:
    name: Get versions
    runs-on: ubuntu-latest
    outputs:
      frp: ${{ steps.version.outputs.frp }}
      ref: ${{ steps.version.outputs.ref }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
      - id: version
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            TAG=${{ github.event.inputs.ref }}
          else
            TAG=${{ github.ref_name }}
          fi
          DATE=`curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/fatedier/frp/releases/tags/${TAG}" | jq -r ".created_at"`
          echo "frp=${TAG#v}" >> $GITHUB_OUTPUT
          echo "ref=${TAG}" >> $GITHUB_OUTPUT
          date -d "${DATE}" +epoch=%s >> $GITHUB_OUTPUT
  build:
    name: Build ${{ matrix.config.d_arch }} packages
    runs-on: ubuntu-24.04-arm
    # runs-on: ${{ matrix.config.host }}
    container:
      image: debian@sha256:c94f5ddd41327aa2d4a7cfba7889056c02936182fd76a513fec6160c97181fc0
      # image: ${{ matrix.config.host_image }}
    strategy:
      matrix:
        config:
          - d_arch: amd64
            c_arch: x86_64-linux-gnu
            h_arch: amd64
            go_arch: amd64
            go_host_arch: amd64
            host: ubuntu-24.04
            host_image: debian@sha256:38a76d01668772e381ad2826d876627c89e7133e2f8a0f5d567306798b0f2a16
          - d_arch: arm64
            c_arch: aarch64-linux-gnu
            h_arch: arm64
            go_arch: arm64
            go_host_arch: arm64
            host: ubuntu-24.04-arm
            host_image: debian@sha256:c94f5ddd41327aa2d4a7cfba7889056c02936182fd76a513fec6160c97181fc0
          # - d_arch: i386 #        Not reproducible
          #   c_arch: i686-linux-gnu
          #   h_arch: amd64
          #   go_arch: 386
          #   go_host_arch: amd64
          #   host: ubuntu-24.04
          #   host_image: debian@sha256:38a76d01668772e381ad2826d876627c89e7133e2f8a0f5d567306798b0f2a16
          - d_arch: armhf
            c_arch: arm-linux-gnueabihf
            h_arch: arm64
            go_arch: arm
            go_host_arch: arm64
            go_arm: 7
            host: ubuntu-24.04-arm
            host_image: debian@sha256:c94f5ddd41327aa2d4a7cfba7889056c02936182fd76a513fec6160c97181fc0
          - d_arch: armel
            c_arch: arm-linux-gnueabi
            h_arch: arm64
            go_arch: arm
            go_host_arch: arm64
            go_arm: 5
            host: ubuntu-24.04-arm
            host_image: debian@sha256:c94f5ddd41327aa2d4a7cfba7889056c02936182fd76a513fec6160c97181fc0
          - d_arch: loong64
            c_arch: loongarch64-linux-gnu
            h_arch: arm64
            go_arch: loong64
            go_host_arch: arm64
            host: ubuntu-26.04-arm
            host_image: debian@sha256:c94f5ddd41327aa2d4a7cfba7889056c02936182fd76a513fec6160c97181fc0
          # - d_arch: mips64el #        No pie
          #   c_arch: mips64el-linux-gnuabi64
          #   h_arch: arm64
          #   go_arch: mips64le
          #   go_host_arch: arm64
          #   host: ubuntu-26.04-arm
          #   host_image: debian@sha256:c94f5ddd41327aa2d4a7cfba7889056c02936182fd76a513fec6160c97181fc0
          # - d_arch: mipsel #        No pie
          #   c_arch: mipsel-linux-gnu
          #   h_arch: arm64
          #   go_arch: mipsle
          #   go_host_arch: arm64
          #   host: ubuntu-26.04-arm
          #   host_image: debian@sha256:c94f5ddd41327aa2d4a7cfba7889056c02936182fd76a513fec6160c97181fc0
          # - d_arch: mips64 #        No pie
          #   c_arch: mips64-linux-gnuabi64
          #   h_arch: arm64
          #   go_arch: mips64
          #   go_host_arch: arm64
          #   host: ubuntu-26.04-arm
          #   host_image: debian@sha256:c94f5ddd41327aa2d4a7cfba7889056c02936182fd76a513fec6160c97181fc0
          # - d_arch: mips #        No pie
          #   c_arch: mips-linux-gnu
          #   h_arch: arm64
          #   go_arch: mips
          #   go_host_arch: arm64
          #   host: ubuntu-26.04-arm
          #   host_image: debian@sha256:c94f5ddd41327aa2d4a7cfba7889056c02936182fd76a513fec6160c97181fc0
          - d_arch: ppc64el
            c_arch: powerpc64le-linux-gnu
            h_arch: arm64
            go_arch: ppc64le
            go_host_arch: arm64
            host: ubuntu-24.04-arm
            host_image: debian@sha256:c94f5ddd41327aa2d4a7cfba7889056c02936182fd76a513fec6160c97181fc0
          # - d_arch: ppc64 #        No arm64 cross toolchain
          #   c_arch: powerpc64-linux-gnu
          #   h_arch: amd64
          #   go_arch: ppc64
          #   go_host_arch: amd64
          #   host: ubuntu-24.04
          #   host_image: debian@sha256:38a76d01668772e381ad2826d876627c89e7133e2f8a0f5d567306798b0f2a16
          - d_arch: riscv64
            c_arch: riscv64-linux-gnu
            h_arch: arm64
            go_arch: riscv64
            go_host_arch: arm64
            host: ubuntu-24.04-arm
            host_image: debian@sha256:c94f5ddd41327aa2d4a7cfba7889056c02936182fd76a513fec6160c97181fc0
          - d_arch: s390x
            c_arch: s390x-linux-gnu
            h_arch: arm64
            go_arch: s390x
            go_host_arch: arm64
            host: ubuntu-24.04-arm
            host_image: debian@sha256:c94f5ddd41327aa2d4a7cfba7889056c02936182fd76a513fec6160c97181fc0
    needs: version
    steps:
      - name: Prepare source and build scripts
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl jq gpg
          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o frp_${{ needs.version.outputs.frp }}.orig.tar.gz \
              https://github.com/fatedier/frp/archive/refs/tags/${{ needs.version.outputs.ref }}.tar.gz
          tar xvf frp_${{ needs.version.outputs.frp }}.orig.tar.gz
          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o frp-debian.tar.gz \
              https://github.com/${{ github.repository }}/archive/${{ github.ref }}.tar.gz
          tar xvf frp-debian.tar.gz --strip-components=1 -C frp-${{ needs.version.outputs.frp }} frp-debian-`echo "${{ github.ref_name }}" | sed 's/^v//'`/debian
      - name: Prepare and build
        working-directory: frp-${{ needs.version.outputs.frp }}
        env:
          GOPROXY: "https://proxy.golang.org"
          C_ARCH: ${{ matrix.config.c_arch }}
          D_ARCH: ${{ matrix.config.d_arch }}
          H_ARCH: arm64
          # H_ARCH: ${{ matrix.config.h_arch }}
          GOHOSTOS: linux
          GOHOSTARCH: arm64
          # GOHOSTARCH: ${{ matrix.config.go_host_arch }}
          GOOS: linux
          GOARCH: ${{ matrix.config.go_arch }}
          SOURCE_DATE_EPOCH: ${{ needs.version.outputs.epoch }}
          DEB_BUILD_OPTIONS: 'nocheck' # Skipping all checks as we are cross-compiling
        run: |
          tar xf ../frp-debian.tar.gz frp-debian-`echo "${{ github.ref_name }}" | sed 's/^v//'`/.github/workflows/.extras.sh -O | sh
          if [ -n "${{ matrix.config.go_arm }}" ]; then export GOARM="${{ matrix.config.go_arm }}"; fi
          export CC=${C_ARCH}-gcc
          export CXX=${C_ARCH}-g++
          dpkg-buildpackage -v${{ needs.version.outputs.frp }}-1 -us -uc -Zgzip -a ${D_ARCH}
      - name: Send built packages - src
        uses: actions/upload-artifact@v7
        if: matrix.config.d_arch == 'amd64'
        with:
          name: src
          retention-days: 1
          path: |
            frp_${{ needs.version.outputs.frp }}.orig.tar.gz
            frp_${{ needs.version.outputs.frp }}-1.debian.tar.gz
            frp_${{ needs.version.outputs.frp }}-1.dsc
      - name: Send built packages - all
        uses: actions/upload-artifact@v7
        if: matrix.config.d_arch == 'amd64'
        with:
          name: all
          retention-days: 1
          path: |
            frp_${{ needs.version.outputs.frp }}-1_all.deb
            frpc-common_${{ needs.version.outputs.frp }}-1_all.deb
            frps-common_${{ needs.version.outputs.frp }}-1_all.deb
      - name: Send built packages - ${{ matrix.config.d_arch }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.d_arch }}
          retention-days: 1
          path: |
            frpc_${{ needs.version.outputs.frp }}-1_${{ matrix.config.d_arch }}.deb
            frpc-dbgsym_${{ needs.version.outputs.frp }}-1_${{ matrix.config.d_arch }}.deb
            frps_${{ needs.version.outputs.frp }}-1_${{ matrix.config.d_arch }}.deb
            frps-dbgsym_${{ needs.version.outputs.frp }}-1_${{ matrix.config.d_arch }}.deb
  repository:
    name: Generate Debian repository and upload all artifacts
    needs: [version,build]
    runs-on: ubuntu-24.04
    steps:
      - name: Get tools
        run: sudo apt install --no-install-recommends dctrl-tools moreutils
      - name: Checkout code to get previous tag
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
      - name: Get previous tag and create target directory
        id: previous
        run: |
          PREVIOUS_TAG=`git describe --abbrev=0 --tags ${{ needs.version.outputs.ref }}^`
          echo "ref=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          mkdir -p download/${{ needs.version.outputs.ref }}
      - name: Download previous Packages (if exists)
        uses: robinraju/release-downloader@v1
        continue-on-error: true
        with:
          tag: ${{ steps.previous.outputs.ref }}
          out-file-path: download/${{ needs.version.outputs.ref }}
          fileName: 'Packages'
      - name: Download previous Sources (if exists)
        uses: robinraju/release-downloader@v1
        continue-on-error: true
        with:
          tag: ${{ steps.previous.outputs.ref }}
          out-file-path: download/${{ needs.version.outputs.ref }}
          fileName: 'Sources'
      - name: Download artifacts from build jobs
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: download/${{ needs.version.outputs.ref }}
      - name: Generate Packages, Sources, and InRelease
        working-directory: download/${{ needs.version.outputs.ref }}
        run: |
          apt-ftparchive packages ../../download/${{ needs.version.outputs.ref }} | sort-dctrl -k Package,Architecture | tee -a Packages
          apt-ftparchive sources ../../download/${{ needs.version.outputs.ref }} | tee -a Sources
          sort-dctrl -k Version:v,Package,Architecture Packages | sponge Packages
          sort-dctrl -k Version:v Sources | sponge Sources
          echo "${{ secrets.GPG_KEY }}" | gpg --batch --import
          PUB=`curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/fatedier/frp/releases/tags/${{ needs.version.outputs.ref }}" | jq -r ".published_at" | date -u -R -f -`
          apt-ftparchive release -o APT::FTPArchive::Release::Date="${PUB}" . | gpg --batch --yes --clearsign --local-user ${{ secrets.GPG_KEY_FINGERPRINT }} --output - | tee InRelease
      - name: Upload all artifacts
        uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: repo
          retention-days: 1
          path: download/${{ needs.version.outputs.ref }}/**
      - name: Upload all files to release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: download/${{ needs.version.outputs.ref }}/**
